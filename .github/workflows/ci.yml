# ============================================================
# TradeFlow CI Pipeline
# This file tells GitHub Actions WHAT to do and WHEN to do it
# Location: .github/workflows/ci.yml
# ============================================================

name: TradeFlow CI Pipeline  # Name shown in GitHub Actions tab

# ============================================================
# TRIGGER — When should this pipeline run?
# ============================================================
on:
  push:
    branches: [ main, develop ]   # Run when code is pushed to main or develop
  pull_request:
    branches: [ main ]            # Run when a PR is opened targeting main
    # PR cannot merge if this pipeline fails

# ============================================================
# JOBS — The actual work. Each job runs on a separate VM.
# Jobs run in PARALLEL by default unless you use "needs"
# ============================================================
jobs:

  # ----------------------------------------------------------
  # JOB 1: Build the app and run tests
  # ----------------------------------------------------------
  build-and-test:
    name: Build & Test                  # Label shown in GitHub UI
    runs-on: ubuntu-latest              # GitHub spins up a fresh Linux VM

    steps:                              # Steps run sequentially inside this job

      # Step 1: Pull your code into the VM
      - name: Checkout code
        uses: actions/checkout@v4       # "uses" means: use a pre-built GitHub Action
        # checkout@v4 = official action to clone your repo

      # Step 2: Install Java 21 on the VM
      - name: Set up Java 21
        uses: actions/setup-java@v4     # Official action to install Java
        with:
          java-version: '21'            # Install Java 21 specifically
          distribution: 'temurin'       # Use Eclipse Temurin build (industry standard)
          cache: maven                  # Cache Maven dependencies = faster future builds

      # Step 3: Compile the code and create the JAR file
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B
        # clean        = delete any previous build files
        # package      = compile + create JAR
        # -DskipTests  = skip tests here, we run them separately next
        # -B           = batch mode, cleaner logs in CI

      # Step 4: Run all JUnit tests
      - name: Run Tests
        run: ./mvnw test -B
        # If ANY test fails, this step fails
        # Pipeline stops here, PR is blocked from merging
        # This is your quality gate

      # Step 5: Save test reports as downloadable artifact
      - name: Upload test results
        if: always()                    # Run this step even if tests failed
        uses: actions/upload-artifact@v4
        with:
          name: test-results            # Name of the artifact in GitHub UI
          path: target/surefire-reports/ # Maven puts test reports here

  # ----------------------------------------------------------
  # JOB 2: Build the Docker image
  # Only runs if Job 1 (build-and-test) passes
  # ----------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest              # Another fresh Linux VM (parallel to Job 1 by default)
    needs: build-and-test               # BUT "needs" makes it wait for Job 1 to pass first
    # If tests fail in Job 1, this job never runs

    steps:

      # Step 1: Pull code again (each job gets a fresh VM)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Build the Docker image
      - name: Build Docker image
        run: docker build -t tradeflow-notification:${{ github.sha }} .
        # docker build          = build image from our Dockerfile
        # -t                    = tag the image with a name
        # ${{ github.sha }}     = the unique commit hash (e.g. a1b2c3d)
        #                         every build gets a unique tag = full traceability
        #                         you know exactly which code version is in any image
        # .                     = use Dockerfile in current directory

      # Step 3: Confirm the image was actually created
      - name: Verify Docker image
        run: docker images tradeflow-notification
        # Lists the image we just built
        # Catches edge cases where build "succeeded" but image wasn't created

# ============================================================
# WHAT HAPPENS WHEN YOU RUN: git push
# ============================================================
# 1. GitHub detects the push
# 2. Reads this file from .github/workflows/ci.yml
# 3. Spins up a Linux VM for Job 1
# 4. Job 1: installs Java, builds JAR, runs 4 JUnit tests
#    - If tests FAIL → pipeline stops, PR blocked, you get an email
#    - If tests PASS → Job 2 starts
# 5. Job 2: spins up another VM, builds Docker image, verifies it
# 6. Green checkmark on your GitHub commit
#
# TOMORROW (Day 2) we add:
# Job 3: Push Docker image to AWS ECR
# Job 4: SSH into EC2 and deploy the new image
# ============================================================